<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="style.css" rel="stylesheet">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>Document</title>
</head>
<body>
    <div class="d1">
        <div class="d2">
            <div class="tasks-table">
                <div class="d4">
                           <h1 class="h1-1">
مهامي
                    </h1>
                                        <button id="add-btn" class="bt-bt1">
                        <span class="material-symbols-outlined">
add_2
</span>
                    </button>
                </div>
                <div class="tasks" id="tasks">

                </div>
            </div>
        </div>
    </div>
</body>
<script>
    let tasks=[
        {
            title:"قراءة كتب",
            date:"1/1/2026",
            isDone:false
        },
         {
            title:"انهاء المشروع النهائي",
            date:"1/1/2026",
            isDone:false
        },
        {
            title:"انهاء كورس الجافا سكريبت ",
            date:"1/1/2026",
            isDone:false
        },
        {
            title:"حل التحدي",
            date:"1/1/2026",
            isDone:true
        },
    ];
    function getTasksFromStorage(){
        let retrievedTasks = JSON.parse(localStorage.getItem("tasks"));
        tasks =retrievedTasks ??[];}
    getTasksFromStorage();
    function fillTaskOnThePage(){
         document.getElementById("tasks").innerHTML="";
         let index=0;
         for(let task of tasks){
        let content=`
        <div class="task ${task.isDone?'done':''}">
            <div class="task-info">
                <h2 class="h1-1"> ${task.title}</h2>
                <div class="task-date" >
                  
    <span class="material-symbols-outlined" style="font-size: 16px; vertical-align: middle; margin-left: 5px;">calendar_month</span>
    <span style="vertical-align: middle;">${task.date}</span>

                    </div>
                    </div>
                    <div class="actions">
                      <button onclick="deleteTask(${index})"  class="bt-bt2">
                        <span class="material-symbols-outlined">delete</span>
                        </button>
                        ${
                        task.isDone
                        ?`<button onclick="toggleTaskCompletion(${index})"class="bt-bt3">
                             <span class="material-symbols-outlined">cancel</span>
                             </button>`
                              :`<button onclick="toggleTaskCompletion(${index})"class="bt-bt4">
                             <span class="material-symbols-outlined">done</span>
                             </button>`
                        }
                             <button onclick="editTask(${index})"class="bt-bt5">
                             <span class="material-symbols-outlined">edit</span>
                             </button>
                             </div>
                             </div>
                             `;
                             document.getElementById("tasks").innerHTML+=content;
                             index++;
    }}
    fillTaskOnThePage();
     document.getElementById("add-btn").addEventListener("click",function(){
        let now =new Date();
        let date =now.getDate()+"/"+
        (now.getMonth()+1)+
        "/"+
        now.getFullYear();
        let taskName= prompt("الرجاء ادخال اسم المهمة");
        if (taskName==null||taskName.trim()===""){
            return;
        }
        let taskObj={
            title:taskName.trim(),
            date:date,
            isDone:false

        };
        tasks.push(taskObj);
        storeTasks();
        fillTaskOnThePage();


    });
    function deleteTask(index){
        let task =tasks[index];
        let isConfirmed = confirm("هل  أنت متأكد من الحذف :"+task.title);
        if(isConfirmed){
            tasks.splice(index,1);
            storeTasks();
               fillTaskOnThePage();

        }
    }
    function editTask(index){
        let task = tasks[index];
        let newTaskTitle=prompt("الرجاء تحديد عنوان المهمة الجديد",task.title);
        if (newTaskTitle===null||newTaskTitle.trim()===""){
return;
        }
        task.title=newTaskTitle.trim();
        storeTasks();
        storeTasks();
          fillTaskOnThePage();

    }
    function toggleTaskCompletion(index){
        tasks[index].isDone= !tasks[index].isDone;
        storeTasks();
          fillTaskOnThePage();
    }
    function storeTasks(){
        localStorage.setItem("tasks",JSON.stringify(tasks));
    }
</script>
</html>
